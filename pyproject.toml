[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "depthwizard"
version = "0.1.0"
description = "SIH26175 - Single-view height estimation and 3D fly-through"
requires-python = ">=3.10"
readme = "README.md"

# Core, always-installed dependencies. Optional/heavy dependencies (rasterio,
# torch, transformers) are declared separately below and the codebase is
# written to degrade gracefully when they are not installed -- see
# src/depthwizard/io/loader.py and src/depthwizard/depth/backends/depth_anything.py.
dependencies = [
    "numpy>=1.26",
    "Pillow>=10",
    "opencv-python-headless>=4.10",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3"]
depth-model = ["torch>=2.2", "transformers>=4.45", "safetensors>=0.4"]
dev = ["streamlit>=1.37", "pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
