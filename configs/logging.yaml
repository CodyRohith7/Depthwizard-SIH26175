version: 1
disable_existing_loggers: false
formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    level: DEBUG
    stream: ext://sys.stdout
root:
  level: INFO
  handlers: [console]
loggers:
  depthwizard:
    level: INFO
    handlers: [console]
    propagate: false
