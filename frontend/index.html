<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DepthWizard -- M1 Viewer Scaffold</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: sans-serif; }
    #overlay { position: absolute; top: 8px; left: 8px; font-size: 13px; line-height: 1.4; max-width: 480px; }
    #overlay b { color: #ffd166; }
    canvas { display: block; }
  </style>
  <!-- Import map: pulls Three.js from a CDN by version-pinned URL. This page
       needs NO npm install and NO build step -- it can be opened directly
       once a static file server is serving this directory (see README.md
       for why file:// alone is not enough for the fetch() below). -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="overlay">
    <div><b>DepthWizard</b> -- Milestone M1 viewer scaffold</div>
    <div id="status">Loading scene...</div>
  </div>
  <script type="module" src="./src/viewer.js"></script>
</body>
</html>
